schema: spec-driven

context: |
  Product: OpenSpec Studio — локальное однопользовательское web-приложение
  для управления OpenSpec Store, Markdown-артефактами, Git и локальными
  AI CLI из одного безопасного интерфейса.

  Stack: Go 1.24+ backend, React 19 + TypeScript frontend, SQLite metadata
  storage, системные Git/OpenSpec/Codex/GigaCode CLI. Конечная поставка —
  автономный CGO-free бинарник со встроенным frontend.

  Architecture: feature-first frontend; Go packages разделены на transport,
  application/domain, adapters и infrastructure. UI не обращается к файловой
  системе или CLI напрямую. Сервер слушает loopback и контролирует все пути,
  процессы и области записи.

  Product invariants:
  - проект содержит один Store и любое число кодовых репозиториев;
  - AI может писать только в активный Store worktree;
  - кодовые репозитории доступны AI только для чтения;
  - AI-результат сначала принимается во внутренний черновик;
  - запись черновика на диск, commit и push требуют явного действия;
  - commit и push кодовых репозиториев запрещены;
  - Untitled UI используется только как визуальный ориентир, без runtime
    dependency;
  - Markdown редактируется визуально, но хранится как переносимый .md;
  - каждый реализованный сценарий сопровождается автоматическими тестами;
  - conventional commits используются для истории Git.

rules:
  proposal:
    - Пиши на русском языке.
    - Всегда добавляй разделы "Цель", "Scope", "Вне scope" и "Риски".
    - Перечисляй затронутые capabilities и явно связывай предложение с baseline specs.
    - Не включай реализацию в scope до согласования наблюдаемого поведения.
  specs:
    - Пиши требования на русском языке с SHALL или MUST.
    - Делай требования атомарными и проверяемыми.
    - Для каждого требования добавляй минимум один WHEN/THEN scenario.
    - Покрывай успешный сценарий, валидации, ошибки, безопасность и состояния UI, когда они применимы.
    - Не ослабляй ограничения области записи AI и локальной безопасности.
  design:
    - Фиксируй границы компонентов, потоки данных и взаимодействие frontend/backend/adapters.
    - Для новых зависимостей описывай причину выбора, альтернативы и способ изоляции.
    - Для файловых и CLI-операций описывай path validation, cancellation, timeout и аудит.
  tasks:
    - Разбивай работу на проверяемые вертикальные шаги.
    - Добавляй тесты в тот же шаг, что и соответствующую логику.
    - Завершай задачи проверкой npm run check и релевантной сборкой.

operations:
  apply:
    guidance:
      - Реализуй только утверждённый change и не расширяй scope неявно.
      - Сохраняй обратную совместимость API или явно описывай миграцию.
      - Не отмечай задачу выполненной до прохождения её тестов.
  archive:
    guidance:
      - Перед архивированием запускай openspec validate --strict для change.
      - Проверяй, что npm run check проходит и baseline specs синхронизированы.
