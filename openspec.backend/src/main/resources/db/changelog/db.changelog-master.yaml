  - changeSet:
      id: 007-record-legacy-version
      author: Sorface Developer
      preConditions:
        - onFail: HALT
        - tableExists:
            tableName: schema_migrations
      changes:
        - sql:
            sql: INSERT OR IGNORE INTO schema_migrations(version, applied_at) VALUES (2, strftime('%Y-%m-%dT%H:%M:%fZ', 'now'))
