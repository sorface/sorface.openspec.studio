databaseChangeLog:
  - changeSet:
      id: 001-compatible-schema
      author: Sorface Developer
      preConditions:
        - onFail: HALT
        - dbms:
            type: sqlite
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE IF NOT EXISTS schema_migrations (version INTEGER PRIMARY KEY, applied_at TEXT NOT NULL);
              CREATE TABLE IF NOT EXISTS projects (
                id TEXT PRIMARY KEY, name TEXT NOT NULL, store_path TEXT NOT NULL,
                active_worktree_id TEXT, default_ai_provider TEXT, default_model TEXT,
                created_at TEXT NOT NULL, updated_at TEXT NOT NULL);
              CREATE INDEX IF NOT EXISTS projects_updated_at_idx ON projects(updated_at DESC);
              CREATE TABLE IF NOT EXISTS task_workspaces (
                id TEXT PRIMARY KEY, project_id TEXT NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
                branch TEXT NOT NULL, path TEXT NOT NULL UNIQUE, managed INTEGER NOT NULL DEFAULT 1,
                created_at TEXT NOT NULL, updated_at TEXT NOT NULL, UNIQUE(project_id, branch));
              CREATE INDEX IF NOT EXISTS task_workspaces_project_idx ON task_workspaces(project_id, updated_at DESC);
              CREATE TABLE IF NOT EXISTS repositories (
                id TEXT PRIMARY KEY, project_id TEXT NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
                name TEXT NOT NULL, path TEXT NOT NULL UNIQUE, remote_url TEXT NOT NULL,
                fingerprint TEXT NOT NULL, branch TEXT NOT NULL DEFAULT '', commit_sha TEXT NOT NULL,
                dirty INTEGER NOT NULL DEFAULT 0, created_at TEXT NOT NULL, updated_at TEXT NOT NULL);
              CREATE INDEX IF NOT EXISTS repositories_project_idx ON repositories(project_id, updated_at DESC);
              CREATE TABLE IF NOT EXISTS operations (
                id TEXT PRIMARY KEY, project_id TEXT NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
                kind TEXT NOT NULL, status TEXT NOT NULL, provider TEXT NOT NULL DEFAULT '',
                model TEXT NOT NULL DEFAULT '', prompt TEXT NOT NULL DEFAULT '', input_json TEXT NOT NULL DEFAULT '{}',
                result_json TEXT NOT NULL DEFAULT '', error_code TEXT NOT NULL DEFAULT '', error_message TEXT NOT NULL DEFAULT '',
                correlation_id TEXT NOT NULL DEFAULT '', openspec_action TEXT NOT NULL DEFAULT '',
                openspec_change TEXT NOT NULL DEFAULT '', openspec_schema TEXT NOT NULL DEFAULT '',
                openspec_artifact TEXT NOT NULL DEFAULT '', openspec_fingerprint TEXT NOT NULL DEFAULT '',
                created_at TEXT NOT NULL, updated_at TEXT NOT NULL);
              CREATE INDEX IF NOT EXISTS operations_project_idx ON operations(project_id, created_at DESC);
              CREATE INDEX IF NOT EXISTS operations_active_idx ON operations(project_id, kind, status);
              CREATE TABLE IF NOT EXISTS operation_events (
                sequence INTEGER PRIMARY KEY AUTOINCREMENT,
                operation_id TEXT NOT NULL REFERENCES operations(id) ON DELETE CASCADE,
                type TEXT NOT NULL, payload TEXT NOT NULL DEFAULT '{}', created_at TEXT NOT NULL);
              CREATE INDEX IF NOT EXISTS operation_events_operation_idx ON operation_events(operation_id, sequence);
              CREATE TABLE IF NOT EXISTS ai_context_entries (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                operation_id TEXT NOT NULL REFERENCES operations(id) ON DELETE CASCADE,
                source TEXT NOT NULL, path TEXT NOT NULL, size INTEGER NOT NULL,
                checksum TEXT NOT NULL, reason TEXT NOT NULL, included INTEGER NOT NULL);
              CREATE TABLE IF NOT EXISTS operation_audit (
                operation_id TEXT PRIMARY KEY REFERENCES operations(id) ON DELETE CASCADE,
                executable TEXT NOT NULL, arguments TEXT NOT NULL, exit_code INTEGER NOT NULL,
                stop_reason TEXT NOT NULL DEFAULT '', stdout_bytes INTEGER NOT NULL,
                stderr_bytes INTEGER NOT NULL, duration_ms INTEGER NOT NULL, created_at TEXT NOT NULL);
              CREATE TABLE IF NOT EXISTS draft_sets (
                id TEXT PRIMARY KEY, project_id TEXT NOT NULL REFERENCES projects(id) ON DELETE CASCADE,
                operation_id TEXT NOT NULL UNIQUE REFERENCES operations(id) ON DELETE CASCADE,
                status TEXT NOT NULL, created_at TEXT NOT NULL, updated_at TEXT NOT NULL);
              CREATE TABLE IF NOT EXISTS draft_mutations (
                id TEXT PRIMARY KEY, set_id TEXT NOT NULL REFERENCES draft_sets(id) ON DELETE CASCADE,
                type TEXT NOT NULL, path TEXT NOT NULL, previous_path TEXT NOT NULL DEFAULT '',
                before_content TEXT NOT NULL DEFAULT '', after_content TEXT NOT NULL DEFAULT '');
              CREATE INDEX IF NOT EXISTS draft_mutations_set_idx ON draft_mutations(set_id);
              CREATE TABLE IF NOT EXISTS openspec_change_drafts (
                project_id TEXT PRIMARY KEY REFERENCES projects(id) ON DELETE CASCADE,
                payload_json TEXT NOT NULL, created_at TEXT NOT NULL, updated_at TEXT NOT NULL);
              INSERT OR IGNORE INTO schema_migrations(version, applied_at) VALUES (1, strftime('%Y-%m-%dT%H:%M:%fZ', 'now'));
              INSERT OR IGNORE INTO schema_migrations(version, applied_at) VALUES (3, strftime('%Y-%m-%dT%H:%M:%fZ', 'now'));
  - changeSet:
      id: 002-legacy-openspec-action
      author: Sorface Developer
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM pragma_table_info('operations') WHERE name='openspec_action'
      changes:
        - sql:
            sql: ALTER TABLE operations ADD COLUMN openspec_action TEXT NOT NULL DEFAULT ''
