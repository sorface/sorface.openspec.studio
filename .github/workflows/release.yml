name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег релиза, например v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Frontend and Kotlin quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openspec.frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm --prefix openspec.frontend ci
      - run: npm --prefix openspec.frontend run check

  package:
    name: Package ${{ matrix.asset }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            asset: openspec-studio-darwin-amd64
          - runner: macos-14
            asset: openspec-studio-darwin-arm64
          - runner: ubuntu-latest
            asset: openspec-studio-linux-amd64
          - runner: ubuntu-24.04-arm
            asset: openspec-studio-linux-arm64
          - runner: windows-latest
            asset: openspec-studio-windows-amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openspec.frontend/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm --prefix openspec.frontend ci
      - run: npm --prefix openspec.frontend run release
      - name: Smoke-test application image
        shell: bash
        run: |
          set -euo pipefail
          image="out/release/${{ matrix.asset }}"
          test -d "$image"
          test -n "$(find "$image" -type f \( -name openspec-studio -o -name openspec-studio.exe \) -print -quit)"
          test -n "$(find "$image" -type f -name 'openspec-studio*.jar' -print -quit)"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: out/release/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v7
        with: { path: out/images }
      - name: Resolve release tag
        shell: bash
        env: { INPUT_TAG: "${{ inputs.tag }}" }
        run: |
          set -euo pipefail
          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then release_tag="$INPUT_TAG"; fi
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          git rev-parse --verify "refs/tags/${release_tag}^{commit}" >/dev/null
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - name: Archive and checksum images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/artifacts
          for image in out/images/openspec-studio-*; do
            name="$(basename "$image")"
            if [[ "$name" == *windows* ]]; then (cd "$image" && zip -qr "../../artifacts/${name}.zip" .)
            else tar -czf "out/artifacts/${name}.tar.gz" -C "$image" .; fi
          done
          (cd out/artifacts && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then gh release upload "$RELEASE_TAG" out/artifacts/* --clobber
          else gh release create "$RELEASE_TAG" out/artifacts/* --verify-tag --generate-notes --title "OpenSpec Studio $RELEASE_TAG"; fi
