name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег релиза, например v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish
    if: github.repository == 'sorface/sorface.openspec.studio'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build release binaries
        run: npm run release

      - name: Resolve and validate release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Тег должен соответствовать формату vMAJOR.MINOR.PATCH"
            exit 1
          fi

          git rev-parse --verify "refs/tags/${release_tag}^{commit}" >/dev/null
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          for binary in \
            openspec-studio-darwin-amd64 \
            openspec-studio-darwin-arm64 \
            openspec-studio-linux-amd64 \
            openspec-studio-linux-arm64
          do
            tar -czf "artifacts/${binary}.tar.gz" -C release "$binary"
          done

          zip -j \
            artifacts/openspec-studio-windows-amd64.zip \
            release/openspec-studio-windows-amd64.exe

          (
            cd artifacts
            sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          )

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --verify-tag \
              --generate-notes \
              --title "OpenSpec Studio $RELEASE_TAG"
          fi
